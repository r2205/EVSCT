# Applies to every Robolectric test in this module.
#
# sdk pins the simulated Android version to the app's targetSdk rather than
# letting each Robolectric release pick its own default — keep it in step with
# targetSdk in app/build.gradle.kts.
#
# graphicsMode NATIVE is required by Compose UI tests: they measure and draw
# for real, and the legacy stubbed graphics throw at draw time.
sdk=35
graphicsMode=NATIVE
