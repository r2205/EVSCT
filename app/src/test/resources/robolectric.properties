# Applies to every Robolectric test in this module.
#
# sdk pins the simulated Android version to the app's targetSdk rather than
# letting each Robolectric release pick its own default — keep it in step with
# targetSdk in app/build.gradle.kts.
#
# graphicsMode NATIVE is required by Compose UI tests: they measure and draw
# for real, and the legacy stubbed graphics throw at draw time.
#
# sdk=36 needs Robolectric 4.16+ and, per its release notes, a JDK 21 runtime —
# on JDK 17 these tests fail rather than degrade. That is why CI sets up JDK 21;
# build on 21 locally too, or ./gradlew testDebugUnitTest will fail for you and
# not for CI. The app itself is still compiled to Java 17 bytecode, which is set
# by compileOptions and jvmTarget in app/build.gradle.kts and is unaffected by
# the JDK running Gradle.
sdk=36
graphicsMode=NATIVE
