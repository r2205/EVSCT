org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Speeds up project sync for dependency-heavy modules by excluding library
# components from constraint propagation. AGP 9 surfaces this as a hint
# when unset; turning it on silences the hint and is a free perf win.
android.dependency.excludeLibraryComponentsFromConstraints=true

# These three are not yet flagged as deprecated by AGP 9.2.1 but exist to
# keep older transitive-dep / R8 behaviour. Left in place until they break
# something — removing them now is unrelated to the warning cleanup.
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
