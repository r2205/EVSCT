org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 nudges a "very large projects" perf flag at sync time, but the
# flag itself is already deprecated. Just silence the suggestion.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# android.builtInKotlin / android.newDsl used to be pinned to false here: the
# kotlin-android plugin registered its own 'kotlin' extension and cast the AGP
# extension to com.android.build.gradle.BaseExtension, neither of which survives
# AGP 9's new DSL. Kotlin 2.3 retires that plugin in favour of AGP's built-in
# Kotlin, so both opt-outs are gone and we now build on the AGP 9 defaults
# (builtInKotlin=true, newDsl=true) — which is also what AGP 10 will require.

# Pre-AGP-9 transitive-dep / R8 behaviour. Not yet flagged as deprecated;
# leave in place until they break something.
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
