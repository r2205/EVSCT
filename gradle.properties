org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 nudges a "very large projects" perf flag at sync time, but the flag
# itself (excludeLibraryComponentsFromConstraints) is already deprecated.
# Just silence the suggestion — the project is small enough that the
# theoretical perf win is negligible.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# AGP 9's built-in Kotlin support collides with our explicit Kotlin plugin
# (both try to register the 'kotlin' Gradle extension). We pin Kotlin to
# 2.2.10 in libs.versions.toml for the Compose compiler, so keep built-in
# disabled until AGP / Kotlin Gradle plugin upstream resolves the conflict.
# This is one accepted deprecation warning, traded against build breakage.
android.builtInKotlin=false

# Pre-AGP-9 transitive-dep / R8 behaviour. Not yet flagged as deprecated;
# leave in place until they break something.
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
