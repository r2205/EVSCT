org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 nudges a "very large projects" perf flag at sync time, but the
# flag itself is already deprecated. Just silence the suggestion.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Two AGP-9 toggles we have to keep in their pre-9 state because the
# Kotlin Gradle plugin 2.2.10 has not migrated off the legacy AGP DSL.
#   builtInKotlin=false: prevents AGP's built-in Kotlin from racing the
#     explicit kotlin-android plugin to register the 'kotlin' extension.
#   newDsl=false: the kotlin-android plugin casts the AGP extension to
#     com.android.build.gradle.BaseExtension, which only exists in the
#     legacy DSL. With newDsl=true the cast fails at plugin apply.
# Both emit deprecation warnings each build. A future Kotlin bump (likely
# 2.3, or a Kotlin-side fix on the 2.2 line) should let us delete both.
android.builtInKotlin=false
android.newDsl=false

# Pre-AGP-9 transitive-dep / R8 behaviour. Not yet flagged as deprecated;
# leave in place until they break something.
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
