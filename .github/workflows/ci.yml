name: CI

# Runs on every push to main and on every pull request, so a broken build —
# including release-only problems like R8 shrinking or the release lint checks —
# gets caught automatically instead of only when someone builds on their laptop.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# If you push again before a run finishes, cancel the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # JDK 21 rather than 17 because Robolectric needs a 21 runtime to simulate
      # SDK 36, which is what app/src/test/resources/robolectric.properties asks
      # for. This only changes the JDK the build runs on: the app is still
      # compiled to Java 17 bytecode via compileOptions and jvmTarget in
      # app/build.gradle.kts, so the release artifact is unchanged.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK (runs R8 + release lint)
        run: ./gradlew assembleRelease --stacktrace
